name: Scheduled MavatCheck

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_email:
        description: "Run only this email, ignoring schedule"
        required: false
        default: ""
      welcome:
        description: "Include welcome banner in the email"
        type: boolean
        required: false
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAVATCHECK_GMAIL_USER: ${{ secrets.MAVATCHECK_GMAIL_USER }}
      MAVATCHECK_GMAIL_APP_PASSWORD: ${{ secrets.MAVATCHECK_GMAIL_APP_PASSWORD }}
      FORCE_EMAIL: ${{ inputs.force_email }}
      WELCOME: ${{ inputs.welcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          # Drop the google-chrome apt source: playwright ships its own chromium
          # and never needs it, but --with-deps runs `apt-get update` across all
          # sources, which fails (exit 100) whenever Google's mirror is mid-sync
          # ("File has unexpected size … Mirror sync in progress?"). Removing it
          # avoids that flaky dependency entirely; the retry covers other blips.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "playwright install failed (attempt $i) — retrying in 20s…"
            sleep 20
          done
          python -m playwright install --with-deps chromium

      - name: Run scheduled subscriptions
        run: |
          args=""
          if [ -n "$FORCE_EMAIL" ]; then
            args="$args --force-email \"$FORCE_EMAIL\""
          fi
          if [ "$WELCOME" = "true" ]; then
            args="$args --welcome"
          fi
          eval python scripts/run_subscriptions.py $args
